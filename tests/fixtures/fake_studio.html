<!doctype html>
<!-- Bản giả rất đơn giản của YouTube Studio, chỉ để test luồng thao tác của bộ đăng. -->
<html>
<head><meta charset="utf-8"><title>Fake Studio</title></head>
<body>
<ytcp-app>
  <input type="file" id="file">
  <ytcp-uploads-dialog id="dlg" style="display:none">
    <div id="title-textarea"><div id="textbox" contenteditable="true">ten-file-mac-dinh</div></div>
    <div id="description-textarea"><div id="textbox" contenteditable="true"></div></div>
    <tp-yt-paper-radio-button name="VIDEO_MADE_FOR_KIDS_MFK">kids</tp-yt-paper-radio-button>
    <tp-yt-paper-radio-button name="VIDEO_MADE_FOR_KIDS_NOT_MFK">not kids</tp-yt-paper-radio-button>
    <button id="next-button">Next</button>
    <tp-yt-paper-radio-button name="PUBLIC">public</tp-yt-paper-radio-button>
    <tp-yt-paper-radio-button name="UNLISTED">unlisted</tp-yt-paper-radio-button>
    <tp-yt-paper-radio-button name="PRIVATE">private</tp-yt-paper-radio-button>
    <ytcp-video-info><a href="https://youtu.be/TEST123">https://youtu.be/TEST123</a></ytcp-video-info>
    <ytcp-video-upload-progress><span class="progress-label">Đang tải lên 10%</span></ytcp-video-upload-progress>
    <div class="error-area"><div id="error-message"></div></div>
    <button id="done-button" disabled>Publish</button>
  </ytcp-uploads-dialog>
  <ytcp-video-share-dialog id="share" style="display:none"><button id="close-button">Close</button></ytcp-video-share-dialog>
</ytcp-app>
<script>
  const mode = location.hash.slice(1);
  document.getElementById('file').addEventListener('change', () => {
    document.getElementById('dlg').style.display = 'block';
    if (mode === 'error') {
      document.getElementById('error-message').textContent = 'Daily upload limit reached';
      return;
    }
    setTimeout(() => {
      document.querySelector('.progress-label').textContent = 'Upload complete';
      document.getElementById('done-button').disabled = false;
    }, 800);
  });
  const group = el => el.getAttribute('name').startsWith('VIDEO_MADE') ? 'kids' : 'vis';
  document.querySelectorAll('tp-yt-paper-radio-button').forEach(r => r.addEventListener('click', () => {
    document.querySelectorAll('tp-yt-paper-radio-button').forEach(o => {
      if (group(o) === group(r)) o.removeAttribute('checked');
    });
    r.setAttribute('checked', '');
  }));
  document.getElementById('done-button').addEventListener('click', () => {
    if (mode !== 'noconfirm') document.getElementById('share').style.display = 'block';
  });
  document.querySelector('#share #close-button').addEventListener('click', () => {
    document.getElementById('share').style.display = 'none';
  });
</script>
</body>
</html>
