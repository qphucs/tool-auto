# Vị trí các thành phần trên YouTube Studio.
# Khi YouTube đổi giao diện và tool đăng lỗi, chỉ cần sửa file này (không cần khởi động lại app).
# Cú pháp selector: CSS, xem https://playwright.dev/python/docs/locators

urls:
  studio: https://studio.youtube.com
  upload: https://www.youtube.com/upload

# URL chứa một trong các chuỗi này nghĩa là chưa đăng nhập
login_url_markers:
  - accounts.google.com
  - ServiceLogin

# URL chứa một trong các chuỗi này nghĩa là tài khoản Google chưa có kênh YouTube
no_channel_markers:
  - create_channel

# Thành phần chỉ có khi đã vào được YouTube Studio
studio_ready: ytcp-app

upload:
  file_input: input[type=file]
  title: "#title-textarea #textbox"
  description: "#description-textarea #textbox"
  not_made_for_kids: tp-yt-paper-radio-button[name=VIDEO_MADE_FOR_KIDS_NOT_MFK]
  next_button: "#next-button"
  visibility:
    public: tp-yt-paper-radio-button[name=PUBLIC]
    unlisted: tp-yt-paper-radio-button[name=UNLISTED]
    private: tp-yt-paper-radio-button[name=PRIVATE]
  video_link: ytcp-video-info a
  done_button: "#done-button"
  # Dòng trạng thái tải lên. Khi còn chứa một trong các chữ dưới đây là video vẫn đang tải lên.
  # Nếu YouTube Studio của bạn dùng ngôn ngữ khác, thêm chữ tương ứng vào đây.
  progress_label: ytcp-video-upload-progress .progress-label
  uploading_texts:
    - Uploading
    - Đang tải lên
  # Ô báo lỗi trong hộp thoại tải lên (vượt giới hạn mỗi ngày, cần xác minh...)
  error: "ytcp-uploads-dialog #error-message"
  # Hộp thoại hiện ra sau khi bấm Đăng / Lưu
  finished_dialogs: ytcp-video-share-dialog, ytcp-uploads-still-processing-dialog
  close_finished_dialog: ytcp-video-share-dialog #close-button, ytcp-uploads-still-processing-dialog #close-button
